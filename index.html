<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stáhnout Kasičku</title>
<style>
  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e1b4b);
    display: flex; align-items: center; justify-content: center;
    font-family: system-ui, sans-serif; color: #f1f5f9; margin: 0;
  }
  .card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 40px 32px; text-align: center; max-width: 360px;
  }
  h1 { font-size: 28px; margin-bottom: 8px; }
  p { color: #94a3b8; margin-bottom: 32px; font-size: 15px; line-height: 1.6; }
  button {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none; border-radius: 16px; color: #fff;
    font-size: 17px; font-weight: 700; padding: 16px 32px;
    cursor: pointer; box-shadow: 0 8px 30px rgba(99,102,241,0.4);
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.97); }
</style>
</head>
<body>
<div class="card">
  <h1>🧊 Kasička</h1>
  <p>Klikni na tlačítko níže a soubor <strong>index.html</strong> se stáhne přímo do tvého počítače.</p>
  <button onclick="download()">⬇️ Stáhnout index.html</button>
</div>
<script>
function download() {
  const html = `<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🧊 Kasička</title>
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Kasička" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
    }
    .wrap { width: 100%; max-width: 420px; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .header-title { font-size: 22px; font-weight: 800; letter-spacing: -0.5px; }
    .header-sub { font-size: 12px; color: #94a3b8; margin-top: 2px; }
    .btn-settings { background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12); color: #94a3b8; border-radius: 12px; padding: 8px 12px; cursor: pointer; font-size: 18px; }
    .sync-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; display: inline-block; margin-left: 8px; vertical-align: middle; box-shadow: 0 0 6px #4ade80; }
    .sync-dot.offline { background: #f87171; box-shadow: 0 0 6px #f87171; }
    .sync-dot.syncing { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; animation: pulse 0.8s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .settings-panel { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; padding: 20px; margin-bottom: 24px; display: none; }
    .settings-panel.open { display: block; }
    .settings-title { font-size: 14px; font-weight: 700; margin-bottom: 16px; color: #cbd5e1; }
    .drink-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; }
    .emoji-input { width: 48px; text-align: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 18px; padding: 8px 4px; outline: none; }
    .label-input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; color: #fff; font-size: 14px; padding: 8px 10px; outline: none; }
    .price-wrap { display: flex; align-items: center; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 0 10px; }
    .price-wrap input { width: 52px; background: transparent; border: none; color: #fff; font-size: 14px; padding: 8px 0; outline: none; }
    .price-wrap span { color: #64748b; font-size: 12px; }
    .btn-save-drinks { width: 100%; margin-top: 8px; background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 12px; color: #fff; font-weight: 700; padding: 12px; cursor: pointer; font-size: 14px; }
    .btn-clear { margin-top: 10px; width: 100%; background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3); border-radius: 12px; color: #f87171; padding: 10px; cursor: pointer; font-size: 13px; font-weight: 600; }
    .balance-card { background: linear-gradient(135deg, rgba(99,102,241,0.2), rgba(139,92,246,0.2)); border: 1px solid rgba(139,92,246,0.3); border-radius: 28px; padding: 36px 24px; text-align: center; transition: all 0.3s ease; margin-bottom: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.4); }
    .balance-card.flash-pos { background: linear-gradient(135deg, rgba(74,222,128,0.25), rgba(99,102,241,0.3)); border-color: rgba(74,222,128,0.4); }
    .balance-card.flash-neg { background: linear-gradient(135deg, rgba(248,113,113,0.25), rgba(99,102,241,0.3)); border-color: rgba(248,113,113,0.4); }
    .balance-label { font-size: 13px; color: #94a3b8; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .balance-amount { font-size: 58px; font-weight: 900; letter-spacing: -2px; line-height: 1; transition: color 0.3s; }
    .balance-amount .czk { font-size: 24px; font-weight: 600; opacity: 0.8; }
    .balance-warning { margin-top: 10px; font-size: 13px; color: #f87171; background: rgba(248,113,113,0.12); border-radius: 8px; padding: 6px 12px; display: inline-block; }
    .drink-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
    .btn-drink { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: none; border-radius: 20px; color: #fff; padding: 18px 12px; cursor: pointer; box-shadow: 0 8px 30px rgba(99,102,241,0.35); transition: transform 0.1s; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .btn-drink:active { transform: scale(0.96); }
    .btn-drink .d-emoji { font-size: 26px; }
    .btn-drink .d-name { font-size: 14px; font-weight: 700; }
    .btn-drink .d-price { font-size: 13px; opacity: 0.75; }
    .btn-deposit { width: 100%; background: linear-gradient(135deg, #059669, #10b981); border: none; border-radius: 20px; color: #fff; font-size: 15px; font-weight: 700; padding: 16px; cursor: pointer; box-shadow: 0 8px 30px rgba(16,185,129,0.3); margin-bottom: 12px; transition: transform 0.1s; }
    .btn-deposit:active { transform: scale(0.98); }
    .deposit-panel { background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); border-radius: 20px; padding: 20px; margin-bottom: 16px; display: none; }
    .deposit-panel.open { display: block; }
    .deposit-label { font-size: 14px; color: #6ee7b7; font-weight: 600; margin-bottom: 12px; }
    .quick-amounts { display: flex; gap: 8px; margin-bottom: 12px; }
    .btn-quick { flex: 1; background: rgba(16,185,129,0.15); border: 1px solid rgba(16,185,129,0.3); border-radius: 10px; color: #6ee7b7; font-weight: 700; padding: 8px 4px; cursor: pointer; font-size: 14px; }
    .btn-quick.selected { background: rgba(16,185,129,0.5); }
    .deposit-row { display: flex; gap: 8px; }
    .deposit-row input { flex: 1; background: rgba(255,255,255,0.08); border: 1px solid rgba(16,185,129,0.3); border-radius: 12px; color: #fff; font-size: 16px; padding: 12px 14px; outline: none; }
    .btn-do-deposit { background: linear-gradient(135deg, #059669, #10b981); border: none; border-radius: 12px; color: #fff; font-weight: 700; padding: 12px 18px; cursor: pointer; font-size: 15px; }
    .history-title { font-size: 13px; color: #64748b; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 12px; margin-top: 8px; }
    .history-list { display: flex; flex-direction: column; gap: 8px; }
    .history-item { display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 12px 16px; }
    .history-item-label { font-size: 14px; font-weight: 600; color: #e2e8f0; }
    .history-item-time { font-size: 11px; color: #475569; margin-top: 2px; }
    .history-item-amount { font-size: 16px; font-weight: 700; }
    .amount-pos { color: #4ade80; }
    .amount-neg { color: #f87171; }
    .empty-state { text-align: center; color: #334155; margin-top: 40px; font-size: 14px; line-height: 1.8; }
    .loading-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; z-index: 100; }
    .loading-screen .spinner { width: 40px; height: 40px; border: 3px solid rgba(99,102,241,0.3); border-top-color: #8b5cf6; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-screen p { color: #94a3b8; font-size: 15px; }
  </style>
</head>
<body>
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <p>Připojuji se…</p>
</div>
<div class="wrap">
  <div class="header">
    <div>
      <div class="header-title">🧊 Kasička <span class="sync-dot syncing" id="syncDot"></span></div>
      <div class="header-sub">Lednice v práci</div>
    </div>
    <button class="btn-settings" onclick="toggleSettings()">⚙️</button>
  </div>
  <div class="settings-panel" id="settingsPanel">
    <div class="settings-title">Nastavení nápojů</div>
    <div id="drinkRows"></div>
    <button class="btn-save-drinks" onclick="saveDrinks()">✅ Uložit nápoje</button>
    <button class="btn-clear" onclick="clearAll()">🗑 Smazat vše a začít znovu</button>
  </div>
  <div class="balance-card" id="balanceCard">
    <div class="balance-label">Aktuální zůstatek</div>
    <div class="balance-amount" id="balanceAmount">– <span class="czk">Kč</span></div>
    <div class="balance-warning" id="balanceWarning" style="display:none"></div>
  </div>
  <div class="drink-grid" id="drinkGrid"></div>
  <button class="btn-deposit" onclick="toggleDeposit()">💰 Vložit peníze</button>
  <div class="deposit-panel" id="depositPanel">
    <div class="deposit-label">Kolik vhazuješ?</div>
    <div class="quick-amounts">
      <button class="btn-quick" onclick="setDeposit(20)">20</button>
      <button class="btn-quick" onclick="setDeposit(50)">50</button>
      <button class="btn-quick" onclick="setDeposit(100)">100</button>
      <button class="btn-quick" onclick="setDeposit(200)">200</button>
    </div>
    <div class="deposit-row">
      <input type="number" id="depositInput" placeholder="Vlastní částka…" onkeydown="if(event.key==='Enter') doDeposit()" />
      <button class="btn-do-deposit" onclick="doDeposit()">Vložit</button>
    </div>
  </div>
  <div id="historySection">
    <div class="history-title">Historie</div>
    <div class="history-list" id="historyList"></div>
  </div>
  <div class="empty-state" id="emptyState" style="display:none">Zatím žádné transakce.<br />Začni vložením peněz nebo si vezmi pití! 🎉</div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  const firebaseConfig = {
    apiKey: "AIzaSyCoWSFfRDL0RVzSiOKDcYHYixWzCtQsT_Q",
    authDomain: "mate-kasicka.firebaseapp.com",
    databaseURL: "https://mate-kasicka-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "mate-kasicka",
    storageBucket: "mate-kasicka.firebasestorage.app",
    messagingSenderId: "54946326002",
    appId: "1:54946326002:web:0640bafdd5be1808a0f76b"
  };
  const DEFAULT_DRINKS = [
    { emoji: "🥤", label: "Pití",  price: 36 },
    { emoji: "🧃", label: "Džus",  price: 45 },
    { emoji: "☕", label: "Káva",  price: 25 },
    { emoji: "🍶", label: "Velké", price: 50 },
  ];
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  let balance = 0, history = [], drinks = DEFAULT_DRINKS;
  const syncDot = document.getElementById("syncDot");
  const setSyncing = () => syncDot.className = "sync-dot syncing";
  const setOnline  = () => syncDot.className = "sync-dot";
  const setOffline = () => syncDot.className = "sync-dot offline";
  const fmtDate = ts => {
    const d = new Date(ts);
    return d.toLocaleDateString("cs-CZ",{day:"2-digit",month:"2-digit"}) + " " + d.toLocaleTimeString("cs-CZ",{hour:"2-digit",minute:"2-digit"});
  };
  function renderBalance() {
    const el = document.getElementById("balanceAmount");
    const warn = document.getElementById("balanceWarning");
    const color = balance >= 0 ? "#4ade80" : "#f87171";
    el.style.color = color;
    el.innerHTML = (balance < 0 ? "−" : "") + Math.abs(balance).toFixed(0) + ' <span class="czk" style="color:' + color + '">Kč</span>';
    warn.style.display = balance < 0 ? "inline-block" : "none";
    if (balance < 0) warn.textContent = "⚠️ Dlužíš " + Math.abs(balance) + " Kč!";
  }
  function renderDrinkGrid() {
    document.getElementById("drinkGrid").innerHTML = drinks.map((d,i) =>
      '<button class="btn-drink" onclick="window._takeDrink(' + i + ')"><span class="d-emoji">' + d.emoji + '</span><span class="d-name">' + d.label + '</span><span class="d-price">−' + d.price + ' Kč</span></button>'
    ).join("");
  }
  function renderHistory() {
    const section = document.getElementById("historySection");
    const empty = document.getElementById("emptyState");
    const list = document.getElementById("historyList");
    if (!history.length) { section.style.display="none"; empty.style.display="block"; return; }
    section.style.display="block"; empty.style.display="none";
    list.innerHTML = history.map(item =>
      '<div class="history-item"><div><div class="history-item-label">' + item.label + '</div><div class="history-item-time">' + fmtDate(item.ts) + '</div></div><div class="history-item-amount ' + (item.amount > 0 ? "amount-pos" : "amount-neg") + '">' + (item.amount > 0 ? "+" : "") + item.amount + ' Kč</div></div>'
    ).join("");
  }
  function renderSettingsRows() {
    document.getElementById("drinkRows").innerHTML = drinks.map((d,i) =>
      '<div class="drink-row"><input type="text" class="emoji-input" id="e' + i + '" value="' + d.emoji + '" maxlength="2"/><input type="text" class="label-input" id="l' + i + '" value="' + d.label + '" placeholder="Název"/><div class="price-wrap"><input type="number" id="p' + i + '" value="' + d.price + '"/><span>Kč</span></div></div>'
    ).join("");
  }
  async function saveToFirebase() {
    setSyncing();
    try { await set(ref(db,"kasicka"),{balance,history,drinks}); setOnline(); }
    catch(e) { setOffline(); }
  }
  onValue(ref(db,"kasicka"), snap => {
    document.getElementById("loadingScreen").style.display = "none";
    const data = snap.val();
    if (data) { balance = data.balance ?? 0; history = data.history ?? []; drinks = data.drinks ?? DEFAULT_DRINKS; }
    renderBalance(); renderDrinkGrid(); renderHistory(); setOnline();
  }, () => { setOffline(); document.getElementById("loadingScreen").style.display = "none"; });
  window._takeDrink = i => {
    const d = drinks[i];
    balance -= d.price;
    history.unshift({type:"drink",amount:-d.price,label:d.emoji+" "+d.label+" (−"+d.price+" Kč)",ts:Date.now()});
    if (history.length > 50) history.pop();
    saveToFirebase(); renderBalance();
    const card = document.getElementById("balanceCard");
    card.classList.add("flash-neg"); setTimeout(() => card.classList.remove("flash-neg"), 600);
  };
  window.doDeposit = () => {
    const amt = parseFloat(document.getElementById("depositInput").value);
    if (!amt || amt <= 0) return;
    balance += amt;
    history.unshift({type:"deposit",amount:amt,label:"💰 Vklad +"+amt+" Kč",ts:Date.now()});
    if (history.length > 50) history.pop();
    saveToFirebase(); renderBalance();
    const card = document.getElementById("balanceCard");
    card.classList.add("flash-pos"); setTimeout(() => card.classList.remove("flash-pos"), 600);
    document.getElementById("depositInput").value = "";
    document.querySelectorAll(".btn-quick").forEach(b => b.classList.remove("selected"));
    document.getElementById("depositPanel").classList.remove("open");
  };
  window.saveDrinks = () => {
    drinks = drinks.map((_,i) => ({
      emoji: document.getElementById("e"+i).value || "🥤",
      label: document.getElementById("l"+i).value || "Nápoj",
      price: parseFloat(document.getElementById("p"+i).value) || 0,
    }));
    saveToFirebase(); renderDrinkGrid();
    document.getElementById("settingsPanel").classList.remove("open");
  };
  window.clearAll = () => {
    if (!confirm("Opravdu smazat vše?")) return;
    balance = 0; history = [];
    saveToFirebase(); renderBalance(); renderHistory();
  };
  window.toggleSettings = () => {
    const p = document.getElementById("settingsPanel");
    if (p.classList.toggle("open")) renderSettingsRows();
  };
  window.toggleDeposit = () => document.getElementById("depositPanel").classList.toggle("open");
  window.setDeposit = val => {
    document.getElementById("depositInput").value = val;
    document.querySelectorAll(".btn-quick").forEach(b => b.classList.toggle("selected", b.textContent == val));
  };
</script>
</body>
</html>`;

  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'index.html';
  a.click();
}
</script>
</body>
</html>
